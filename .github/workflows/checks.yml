name: Environment checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n bin/mcp-env
      - name: Install the checksum-pinned runtime
        run: bin/mcp-env bootstrap
      - name: Exercise real commands and rejection paths in a disposable project
        run: python3 tests/integration.py
